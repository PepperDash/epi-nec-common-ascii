name: Essentials Plugin Builds

on:
  push:
    branches:
      - main
      - development
      - feature/**
      - release/**
      - hotfix/**
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build
        required: true
        type: string

jobs:
  call-workflow:
    uses: PepperDash/workflow-templates/.github/workflows/essentialsplugins-builds.yml@main
    secrets: inherit
    with:
      branch: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name }}
      default-branch: main